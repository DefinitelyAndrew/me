<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRMD | CCL Capsule Display</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background: #111;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 20px 16px;
    font-family: 'Inter', sans-serif;
}

/* ── Bezel ── */
.drmd-outer {
    width: 100%;
    max-width: 1200px;
    background: #000;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 
        0 8px 32px rgba(0,0,0,0.8),
        inset 0 1px 2px rgba(255,255,255,0.1);
    border: 2px solid #222;
}

/* ── Display panel ── */
.drmd-panel {
    background: #ffffff; /* White background matching the picture */
    border-radius: 4px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
}

/* ── LCD Header (Kept for functional context) ── */
.lcd-header {
    background: #151515;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    border-bottom: 2px solid #222;
    flex-shrink: 0;
}
.lcd-dest { font-size: 18px; font-weight: 700; color: #f99d25; letter-spacing: 0.02em; }
.lcd-status { font-size: 18px; font-weight: 600; color: #fff; }

/* ── Main map area ── */
.map-row {
    display: flex;
    align-items: stretch;
    height: 450px;
    position: relative;
    padding: 20px;
}

.map-area {
    flex: 1;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}

#mapSvg { 
    display: block; 
    width: 100%; 
    height: 100%;
}

/* ── Controls ── */
.controls {
    width: 100%; max-width: 1200px;
    display: flex; flex-direction: column; gap: 10px;
    background: #1e1e1e;
    padding: 16px;
    border-radius: 8px;
}
.ctrl-row { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.ctrl-lbl {
    font-size: 11px; font-weight: 700; color: #888;
    letter-spacing: 0.1em; text-transform: uppercase;
    min-width: 110px; padding-top: 7px; flex-shrink: 0;
}
.btn-grp { display: flex; gap: 6px; flex-wrap: wrap; }
.btn {
    font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600;
    padding: 8px 14px; border-radius: 6px; border: 1px solid #333; background: #222; color: #999;
    cursor: pointer; transition: all 0.12s; white-space: nowrap;
}
.btn:hover { background: #2a2a2a; color: #ccc; }
.btn.on { background: #f99d25; color: #000; border-color: #f99d25; }

.btn-next { background: #39ff14; color: #000; border-color: #39ff14; font-size: 14px; padding: 10px 20px; font-weight: 800; }
.btn-next:hover { background: #32e011; }
.btn-next:active { transform: scale(0.96); }

.station-scroll { display: flex; gap: 5px; flex-wrap: wrap; max-height: 120px; overflow-y: auto; padding: 2px; }
.sbtn { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 4px; border: 1px solid #2a2a2a; background: #151515; color: #666; cursor: pointer; transition: all 0.12s; white-space: nowrap; }
.sbtn:hover { background: #222; color: #aaa; }
.sbtn.on { background: #f99d25; color: #000; border-color: #f99d25; }
</style>
</head>
<body>

<div class="drmd-outer">
  <div class="drmd-panel">
    <div class="lcd-header">
      <div class="lcd-dest" id="lcdDest">Circle Line</div>
      <div class="lcd-status" id="lcdStatus"></div>
    </div>

    <div class="map-row">
      <div class="map-area">
        <svg id="mapSvg" viewBox="0 0 1020 400" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
    </div>
  </div>
</div>

<div class="controls">
  <div class="ctrl-row">
    <span class="ctrl-lbl">Manual Control</span>
    <div class="btn-grp">
      <button class="btn btn-next" onclick="triggerNextStation()">▶ NEXT STATION</button>
    </div>
  </div>
  <div class="ctrl-row">
    <span class="ctrl-lbl">Jump To Station</span>
    <div class="station-scroll" id="stationBtns"></div>
  </div>
  <div class="ctrl-row">
    <span class="ctrl-lbl">Direction</span>
    <div class="btn-grp">
      <button class="btn on" id="btnCW"  onclick="setDir('cw')">⟳ Outer Loop (HarbourFront)</button>
      <button class="btn"    id="btnCCW" onclick="setDir('ccw')">⟲ Inner Loop (Dhoby Ghaut)</button>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════
// STATION GEOMETRY & DATA
// ════════════════════════════════════════
// Layout matches the specific stadium/capsule shape from the reference image.
// ldir: 1 = Top, -1 = Bottom, 2 = Left, 0 = Right

const STATIONS = [
    // --- DHOBY GHAUT BRANCH (FADED) ---
    { c: 'CC1',  n: 'Dhoby Ghaut',        x: 80,  y: 240, ldir: -1, ix: ['NE 6', 'NS 24'], faded: true },
    { c: 'CC2',  n: 'Bras Basah',         x: 150, y: 240, ldir: -1, ix: [], faded: true },
    { c: 'CC3',  n: 'Esplanade',          x: 220, y: 240, ldir: -1, ix: [], faded: true },
    // --- MAIN LOOP ---
    { c: 'CC4',  n: 'Promenade',          x: 280, y: 300, ldir: -1, ix: ['DT 15'] },
    { c: 'CC5',  n: 'Nicoll Highway',     x: 345, y: 300, ldir: 1,  ix: [] },
    { c: 'CC6',  n: 'Stadium',            x: 410, y: 300, ldir: -1, ix: [] },
    { c: 'CC7',  n: 'Mountbatten',        x: 475, y: 300, ldir: 1,  ix: [] },
    { c: 'CC8',  n: 'Dakota',             x: 540, y: 300, ldir: -1, ix: [] },
    { c: 'CC9',  n: 'Paya Lebar',         x: 605, y: 300, ldir: 1,  ix: ['EW 8'] },
    { c: 'CC10', n: 'MacPherson',         x: 670, y: 300, ldir: -1, ix: ['DT 26'] },
    { c: 'CC11', n: 'Tai Seng',           x: 735, y: 300, ldir: 1,  ix: [] },
    { c: 'CC12', n: 'Bartley',            x: 800, y: 300, ldir: -1, ix: [] },
    { c: 'CC13', n: 'Serangoon',          x: 865, y: 300, ldir: 1,  ix: ['NE 12'] },
    { c: 'CC14', n: 'Lorong Chuan',       x: 965, y: 200, ldir: 0,  ix: [] }, // Right curve apex
    { c: 'CC15', n: 'Bishan',             x: 865, y: 100, ldir: -1, ix: ['NS 17'] },
    { c: 'CC16', n: 'Marymount',          x: 810, y: 100, ldir: 1,  ix: [] },
    { c: 'CC17', n: 'Caldecott',          x: 755, y: 100, ldir: -1, ix: ['TE 9'] },
    { c: 'CC19', n: 'Botanic Gardens',    x: 700, y: 100, ldir: 1,  ix: ['DT 9'] },
    { c: 'CC20', n: 'Farrer Road',        x: 645, y: 100, ldir: -1, ix: [] },
    { c: 'CC21', n: 'Holland Village',    x: 590, y: 100, ldir: 1,  ix: [] },
    { c: 'CC22', n: 'Buona Vista',        x: 535, y: 100, ldir: -1, ix: ['EW 21'] },
    { c: 'CC23', n: 'one-north',          x: 480, y: 100, ldir: 1,  ix: [] },
    { c: 'CC24', n: 'Kent Ridge',         x: 425, y: 100, ldir: -1, ix: [] },
    { c: 'CC25', n: 'Haw Par Villa',      x: 370, y: 100, ldir: 1,  ix: [] },
    { c: 'CC26', n: 'Pasir Panjang',      x: 315, y: 100, ldir: -1, ix: [] },
    { c: 'CC27', n: 'Labrador Park',      x: 260, y: 100, ldir: 1,  ix: [] },
    { c: 'CC28', n: 'Telok Blangah',      x: 205, y: 100, ldir: -1, ix: [] },
    { c: 'CC29', n: 'HarbourFront',       x: 150, y: 100, ldir: 1,  ix: ['NE 1'] },
    { c: 'CC30', n: 'Keppel',             x: 79,  y: 129, ldir: -1, ix: [] }, // Top-Left Curve
    { c: 'CC31', n: 'Cantonment',         x: 50,  y: 200, ldir: 2,  ix: [] }, // Left curve apex
    { c: 'CC32', n: 'Prince Edward Road', x: 79,  y: 271, ldir: -1, ix: [] }, // Bottom-Left Curve
    { c: 'CC33', n: 'Marina Bay',         x: 150, y: 300, ldir: -1, ix: ['NS 27', 'TE 20'] },
    { c: 'CC34', n: 'Bayfront',           x: 215, y: 300, ldir: -1, ix: ['DT 16'] },
];

const LINE_COLORS = {
    CC: '#f99d25', NS: '#d42e12', EW: '#009645', NE: '#9900aa', DT: '#005da9', TE: '#9d5b25'
};

// Outer loop travel logic order
const TRAVEL_SEQUENCE = [
    'CC1','CC2','CC3','CC4','CC5','CC6','CC7','CC8','CC9','CC10','CC11','CC12',
    'CC13','CC14','CC15','CC16','CC17','CC19','CC20','CC21','CC22','CC23','CC24',
    'CC25','CC26','CC27','CC28','CC29','CC30','CC31','CC32','CC33','CC34'
];

let curCode = 'CC28'; // Matches the picture (Telok Blangah is current)
let dir = 'cw';

function getSeqIndex(code) { return TRAVEL_SEQUENCE.indexOf(code); }
function getStation(code) { return STATIONS.find(s => s.c === code); }

function nxtIdx(code, d) {
    let i = getSeqIndex(code);
    if (d === 'cw') {
        if(i === TRAVEL_SEQUENCE.length - 1) return getSeqIndex('CC4'); // Loop back
        return i + 1;
    } else {
        if(i === getSeqIndex('CC4')) return TRAVEL_SEQUENCE.length - 1;
        if(i === 0) return 0; // Terminus
        return i - 1;
    }
}

// ════════════════════════════════════════
// SVG RENDERING
// ════════════════════════════════════════
function svgEl(tag, attrs, txt) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    if (txt !== undefined) el.textContent = txt;
    return el;
}

function buildMap() {
    const svg = document.getElementById('mapSvg');
    svg.innerHTML = '';

    // ── 1. Tracks ──
    const trackGroup = svgEl('g');
    
    // Main Capsule Track
    const mainTrack = svgEl('path', {
        d: "M 150 100 L 865 100 A 100 100 0 0 1 965 200 A 100 100 0 0 1 865 300 L 150 300 A 100 100 0 0 1 50 200 A 100 100 0 0 1 150 100",
        fill: "none", stroke: LINE_COLORS.CC, "stroke-width": "6"
    });
    trackGroup.appendChild(mainTrack);

    // Faded Spur Track
    const spurTrack = svgEl('path', {
        d: "M 80 240 L 220 240 C 260 240 280 270 280 300",
        fill: "none", stroke: "#fbe2c5", "stroke-width": "6"
    });
    trackGroup.appendChild(spurTrack);
    svg.appendChild(trackGroup);

    // ── 2. Decorative Direction Arrows ──
    drawStaticArrows(svg);

    // ── 3. Stations ──
    const curSeqI = getSeqIndex(curCode);
    
    STATIONS.forEach(st => {
        const seqI = getSeqIndex(st.c);
        
        // Determine Past/Current/Future state based on Outer Loop direction
        let state = 'future';
        if (st.c === curCode) {
            state = 'current';
        } else if (st.faded) {
            state = 'faded'; // Dhoby branch is faded out in the reference picture
        } else if (dir === 'cw') {
            state = seqI < curSeqI ? 'past' : 'future';
        } else {
            state = seqI > curSeqI ? 'past' : 'future';
        }

        // Apply exactly matching colors from the image
        let dotFill, dotStroke, dotR = 6, dotStrokeW = 0;
        
        if (state === 'current') {
            dotFill = '#ff0000'; // Bright red
            dotStroke = '#ff0000';
            dotR = 8;
        } else if (state === 'future') {
            dotFill = '#00ff00'; // Bright lime green
            dotStroke = '#00ff00';
        } else if (state === 'past') {
            dotFill = '#ffce00'; // Yellow inner
            dotStroke = LINE_COLORS.CC; // Orange ring
            dotStrokeW = 3;
            dotR = 7;
        } else { // Faded
            dotFill = '#fff';
            dotStroke = '#fbe2c5';
            dotStrokeW = 2;
        }

        // Station Dot
        svg.appendChild(svgEl('circle', {
            cx: st.x, cy: st.y, r: dotR, fill: dotFill, 
            stroke: dotStroke, 'stroke-width': dotStrokeW
        }));

        // Labels & Pills Rendering
        drawStationLabels(svg, st);
    });
}

function drawStationLabels(svg, st) {
    const isFaded = st.faded;
    const opacity = isFaded ? '0.3' : '1';
    
    // Calculate Pill Data
    const allCodes = [st.c, ...st.ix];
    let totalPillWidth = 0;
    const pillData = allCodes.map(code => {
        const type = code.substring(0, 2);
        const w = code.length > 4 ? 40 : 34; // rough calc for "CC 29" vs "NE 1"
        totalPillWidth += w + 4; // 4px gap
        return { text: code, type, w };
    });
    totalPillWidth -= 4; // remove last gap

    // Positioning based on ldir
    let startX = st.x - totalPillWidth / 2;
    let pillY, nameY;
    let textAnchor = "middle";
    let nameX = st.x;

    if (st.ldir === 1) { // Top
        pillY = st.y - 20;
        nameY = st.y - 36;
    } else if (st.ldir === -1) { // Bottom
        pillY = st.y + 10;
        nameY = st.y + 30;
    } else if (st.ldir === 2) { // Left (Cantonment)
        startX = st.x - 30 - totalPillWidth;
        pillY = st.y - 8;
        nameY = st.y + 12;
        nameX = startX + totalPillWidth;
        textAnchor = "end";
    } else if (st.ldir === 0) { // Right (Lorong Chuan)
        startX = st.x + 20;
        pillY = st.y - 8;
        nameY = st.y + 12;
        nameX = startX;
        textAnchor = "start";
    }

    // Draw Pills
    let curX = startX;
    pillData.forEach(p => {
        const isCC = p.type === 'CC';
        const bg = LINE_COLORS[p.type] || '#333';
        const fg = isCC ? '#000' : '#fff'; // In the picture, CC pills have black text!

        const g = svgEl('g', { opacity });
        g.appendChild(svgEl('rect', {
            x: curX, y: pillY, width: p.w, height: 16, rx: 8, fill: bg
        }));
        
        const txt = svgEl('text', {
            x: curX + p.w / 2, y: pillY + 11.5,
            'text-anchor': 'middle', 'font-family': 'Inter, sans-serif',
            'font-size': '9', 'font-weight': '700', fill: fg
        });
        txt.textContent = p.text;
        g.appendChild(txt);
        svg.appendChild(g);

        curX += p.w + 4;
    });

    // Draw Station Name
    const nameTxt = svgEl('text', {
        x: nameX, y: nameY, 'text-anchor': textAnchor,
        'font-family': 'Inter, sans-serif', 'font-size': '10',
        'font-weight': '600', fill: '#000', opacity
    });
    
    // Split long names (like Holland Village) if needed, but in the picture they fit nicely.
    nameTxt.textContent = st.n;
    svg.appendChild(nameTxt);
}

function drawStaticArrows(svg) {
    // Top-Left Solid Green Arrow (Outer Loop)
    svg.appendChild(svgEl('path', {
        d: "M 20 180 L 20 80 Q 20 60 40 60 L 60 60 L 60 55 L 75 65 L 60 75 L 60 70 L 40 70 Q 30 70 30 80 L 30 180 Z",
        fill: "#71cc16", stroke: "#ffce00", "stroke-width": "1"
    }));

    // Bottom-Right Solid Green Arrow (Outer Loop)
    svg.appendChild(svgEl('path', {
        d: "M 990 120 L 990 220 Q 990 240 970 240 L 950 240 L 950 235 L 935 245 L 950 255 L 950 250 L 970 250 Q 980 250 980 240 L 980 120 Z",
        fill: "#71cc16", stroke: "#ffce00", "stroke-width": "1"
    }));

    // Top-Right Hollow Orange Arrow (Inner Loop)
    svg.appendChild(svgEl('path', {
        d: "M 975 160 L 975 80 Q 975 60 955 60 L 935 60 L 935 55 L 920 65 L 935 75 L 935 70 L 955 70 Q 965 70 965 80 L 965 160 Z",
        fill: "none", stroke: LINE_COLORS.CC, "stroke-width": "2"
    }));

    // Bottom-Left Hollow Orange Arrow (Inner Loop)
    svg.appendChild(svgEl('path', {
        d: "M 35 240 L 35 320 Q 35 340 55 340 L 75 340 L 75 335 L 90 345 L 75 355 L 75 350 L 55 350 Q 45 350 45 340 L 45 240 Z",
        fill: "none", stroke: LINE_COLORS.CC, "stroke-width": "2"
    }));
}

// ════════════════════════════════════════
// CONTROLS & STATE
// ════════════════════════════════════════
function updateLED() {
    const nextCode = TRAVEL_SEQUENCE[nxtIdx(curCode, dir)];
    const nxtSt = getStation(nextCode);
    const destEl = document.getElementById('lcdDest');
    const statEl = document.getElementById('lcdStatus');
    
    destEl.textContent = dir === 'cw' ? 'Dest: HarbourFront / Outer Loop' : 'Dest: Dhoby Ghaut / Inner Loop';
    statEl.textContent = `Next Station: ${nxtSt.n} (${nxtSt.c})`;
}

function triggerNextStation() {
    curCode = TRAVEL_SEQUENCE[nxtIdx(curCode, dir)];
    updateUI();
}

function setDir(d) {
    dir = d;
    document.getElementById('btnCW').classList.toggle('on',  d === 'cw');
    document.getElementById('btnCCW').classList.toggle('on', d === 'ccw');
    updateUI();
}

function buildStationBtns() {
    const wrap = document.getElementById('stationBtns');
    wrap.innerHTML = '';
    TRAVEL_SEQUENCE.forEach((code) => {
        const st = getStation(code);
        const b = document.createElement('button');
        b.className = 'sbtn' + (code === curCode ? ' on' : '');
        b.textContent = `${st.c} ${st.n}`;
        b.addEventListener('click', () => {
            curCode = code;
            updateUI();
        });
        wrap.appendChild(b);
    });
}

function updateStationBtns() {
    document.querySelectorAll('#stationBtns .sbtn').forEach((b, i) => {
        b.classList.toggle('on', TRAVEL_SEQUENCE[i] === curCode);
    });
}

function updateUI() {
    updateLED();
    updateStationBtns();
    buildMap();
}

// Init
buildStationBtns();
updateUI();

</script>
</body>
</html>
