<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMRT Circle Line Station Display</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .display-container {
            background: #1e1e1e;
            border: 4px solid #ff9e1b; /* CCL Orange */
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(255, 158, 27, 0.3);
            width: 500px; /* Kept original width */
            max-width: 90%;
        }
        
        /* Reverted back to the actual solid circle without the spinner gap */
        .circle-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 30px auto;
        }
        .circle-ring {
            width: 100%;
            height: 100%;
            border: 6px solid #ff9e1b; 
            border-radius: 50%;
            box-sizing: border-box;
        }
        .circle-inner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            font-weight: bold;
            color: #ff9e1b;
            text-align: center;
        }

        /* Reverted back to original clean text format without the pill background */
        .station-code {
            font-size: 24px;
            font-weight: bold;
            color: #ff9e1b;
            margin-bottom: 10px;
        }
        .station-name {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Centered blinking doors indicator to fit the original format */
        .door-indicator {
            font-size: 20px;
            font-weight: bold;
            color: #39ff14;
            height: 24px;
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.6);
        }
        .blink-animation {
            animation: blinkFast 0.8s step-end infinite;
        }
        @keyframes blinkFast {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Reverted back to original ARRIVING AT STATION text */
        .status-box {
            font-size: 18px;
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 8px;
            background: rgba(255, 158, 27, 0.15);
            color: #ff9e1b;
            display: inline-block;
            animation: pulseAnimation 1.5s infinite;
            margin-bottom: 30px;
        }
        @keyframes pulseAnimation {
            0% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.03); }
            100% { opacity: 0.4; transform: scale(1); }
        }

        .btn {
            background-color: #ff9e1b;
            color: #121212;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(255, 158, 27, 0.4);
        }
        .btn:hover {
            background-color: #ffa834;
            transform: translateY(-2px);
        }
        .btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="display-container">
        <div class="circle-container">
            <div class="circle-ring"></div>
            <div class="circle-inner">CC LINE</div>
        </div>
        
        <div class="station-code" id="stationCode">CC1</div>
        <div class="station-name" id="stationName">Dhoby Ghaut</div>
        
        <div class="door-indicator" id="doorIndicator">&lt;&lt; DOORS OPENING</div>

        <div class="status-box" id="statusText">ARRIVING AT STATION</div>
        <br>
        <button class="btn" onclick="nextStation()">Next Station</button>
    </div>

    <script>
        // Full array containing all operational stations and their respective door sides
        const stations = [
            { code: "CC1", name: "Dhoby Ghaut", doorSide: "right" },
            { code: "CC2", name: "Bras Basah", doorSide: "left" },
            { code: "CC3", name: "Esplanade", doorSide: "right" },
            { code: "CC4", name: "Promenade", doorSide: "right" },
            { code: "CC5", name: "Nicoll Highway", doorSide: "left" },
            { code: "CC6", name: "Stadium", doorSide: "right" },
            { code: "CC7", name: "Mountbatten", doorSide: "left" },
            { code: "CC8", name: "Dakota", doorSide: "right" },
            { code: "CC9", name: "Paya Lebar", doorSide: "right" },
            { code: "CC10", name: "MacPherson", doorSide: "left" },
            { code: "CC11", name: "Tai Seng", doorSide: "right" },
            { code: "CC12", name: "Bartley", doorSide: "right" },
            { code: "CC13", name: "Serangoon", doorSide: "right" },
            { code: "CC14", name: "Lorong Chuan", doorSide: "left" },
            { code: "CC15", name: "Bishan", doorSide: "right" },
            { code: "CC16", name: "Marymount", doorSide: "right" },
            { code: "CC17", name: "Caldecott", doorSide: "left" },
            { code: "CC19", name: "Botanic Gardens", doorSide: "right" },
            { code: "CC20", name: "Farrer Road", doorSide: "left" },
            { code: "CC21", name: "Holland Village", doorSide: "right" },
            { code: "CC22", name: "Buona Vista", doorSide: "right" },
            { code: "CC23", name: "one-north", doorSide: "left" },
            { code: "CC24", name: "Kent Ridge", doorSide: "right" },
            { code: "CC25", name: "Haw Par Villa", doorSide: "left" },
            { code: "CC26", name: "Pasir Panjang", doorSide: "right" },
            { code: "CC27", name: "Labrador Park", doorSide: "right" },
            { code: "CC28", name: "Telok Blangah", doorSide: "left" },
            { code: "CC29", name: "HarbourFront", doorSide: "right" }
        ];

        let currentIndex = 0;

        function updateDisplay() {
            const station = stations[currentIndex];
            
            // Update Core Info
            document.getElementById("stationCode").textContent = station.code;
            document.getElementById("stationName").textContent = station.name;
            
            // Handle Door Indicator Direction
            const doorIndicator = document.getElementById("doorIndicator");
            if (station.doorSide === "left") {
                doorIndicator.textContent = "<< DOORS OPENING";
            } else {
                doorIndicator.textContent = "DOORS OPENING >>";
            }

            // Reset Door Animation
            doorIndicator.classList.remove("blink-animation");
            void doorIndicator.offsetWidth; // Trigger DOM reflow
            doorIndicator.classList.add("blink-animation");

            // Reset Pulse Animation for Status Box
            const statusBox = document.getElementById("statusText");
            statusBox.style.animation = 'none';
            statusBox.offsetHeight; // Trigger DOM reflow
            statusBox.style.animation = 'pulseAnimation 1.5s infinite';
        }

        function nextStation() {
            currentIndex = (currentIndex + 1) % stations.length;
            updateDisplay();
        }

        // Initial load
        updateDisplay();
    </script>

</body>
</html>
