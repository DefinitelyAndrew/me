<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TELCSG | CCL Capsule DRMD</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background: #0d0d0d;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 20px 16px;
    font-family: 'Inter', sans-serif;
}

/* ── Display Bezel ── */
.drmd-outer {
    width: 100%;
    max-width: 1240px;
    background: #000000;
    border-radius: 14px;
    padding: 16px;
    box-shadow: 
        0 12px 40px rgba(0,0,0,0.9),
        inset 0 1px 2px rgba(255,255,255,0.15);
    border: 2px solid #222;
}

.drmd-panel {
    background: #ffffff;
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    width: 100%;
}

/* ── LCD Header Bar ── */
.lcd-header {
    background: #141414;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    border-bottom: 3px solid #282828;
    flex-shrink: 0;
}
.lcd-dest { font-size: 16px; font-weight: 700; color: #f99d25; letter-spacing: 0.03em; }
.lcd-status { font-size: 16px; font-weight: 600; color: #ffffff; }

/* ── Map Container ── */
.map-row {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 24px 12px;
    background: #ffffff;
}

.map-area {
    width: 100%;
    max-width: 1180px;
    aspect-ratio: 1180 / 420;
    position: relative;
}

#mapSvg { 
    display: block; 
    width: 100%; 
    height: 100%;
}

/* ── Control Console ── */
.controls {
    width: 100%;
    max-width: 1240px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: #1a1a1a;
    padding: 18px;
    border-radius: 10px;
    border: 1px solid #2c2c2c;
}
.ctrl-row { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.ctrl-lbl {
    font-size: 11px; font-weight: 700; color: #888;
    letter-spacing: 0.1em; text-transform: uppercase;
    min-width: 120px; padding-top: 8px; flex-shrink: 0;
}
.btn-grp { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
    font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600;
    padding: 8px 16px; border-radius: 6px; border: 1px solid #333; background: #222; color: #aaa;
    cursor: pointer; transition: all 0.12s; white-space: nowrap;
}
.btn:hover { background: #2d2d2d; color: #fff; }
.btn.on { background: #f99d25; color: #000; border-color: #f99d25; font-weight: 700; }

.btn-next { background: #39ff14; color: #000; border-color: #39ff14; font-size: 14px; padding: 10px 22px; font-weight: 800; }
.btn-next:hover { background: #32e011; }
.btn-next:active { transform: scale(0.97); }

.station-scroll {
    display: flex; gap: 6px; flex-wrap: wrap; max-height: 130px;
    overflow-y: auto; padding: 4px; width: 100%;
}
.sbtn {
    font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600;
    padding: 6px 10px; border-radius: 4px; border: 1px solid #333;
    background: #141414; color: #777; cursor: pointer; transition: all 0.12s; white-space: nowrap;
}
.sbtn:hover { background: #222; color: #ccc; }
.sbtn.on { background: #f99d25; color: #000; border-color: #f99d25; font-weight: 700; }
</style>
</head>
<body>

<div class="drmd-outer">
  <div class="drmd-panel">
    <div class="lcd-header">
      <div class="lcd-dest" id="lcdDest">Circle Line</div>
      <div class="lcd-status" id="lcdStatus"></div>
    </div>

    <div class="map-row">
      <div class="map-area">
        <svg id="mapSvg" viewBox="0 0 1180 420" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
    </div>
  </div>
</div>

<div class="controls">
  <div class="ctrl-row">
    <span class="ctrl-lbl">Manual Control</span>
    <div class="btn-grp">
      <button class="btn btn-next" onclick="triggerNextStation()">▶ NEXT STATION</button>
    </div>
  </div>
  <div class="ctrl-row">
    <span class="ctrl-lbl">Jump To Station</span>
    <div class="station-scroll" id="stationBtns"></div>
  </div>
  <div class="ctrl-row">
    <span class="ctrl-lbl">Direction</span>
    <div class="btn-grp">
      <button class="btn on" id="btnCW"  onclick="setDir('cw')">⟳ Outer Loop (via HarbourFront)</button>
      <button class="btn"    id="btnCCW" onclick="setDir('ccw')">⟲ Inner Loop (via Marina Bay)</button>
    </div>
  </div>
</div>

<script>
// Complete Circle Line Station Directory (CCL1 to CCL34 + Spur)
const STATIONS = [
    // Main Loop Top & Sides
    { c: 'CC29', n: 'HarbourFront',       x: 180, y: 90,  ldir: 1,  ix: ['NE 1'] },
    { c: 'CC27', n: 'Labrador Park',      x: 290, y: 90,  ldir: 1,  ix: [] },
    { c: 'CC25', n: 'Haw Par Villa',      x: 400, y: 90,  ldir: 1,  ix: [] },
    { c: 'CC23', n: 'one-north',          x: 510, y: 90,  ldir: 1,  ix: [] },
    { c: 'CC21', n: 'Holland Village',    x: 620, y: 90,  ldir: 1,  ix: [] },
    { c: 'CC19', n: 'Botanic Gardens',    x: 730, y: 90,  ldir: 1,  ix: ['DT 9'] },
    { c: 'CC16', n: 'Marymount',          x: 870, y: 90,  ldir: 1,  ix: [] },
    { c: 'CC15', n: 'Bishan',             x: 960, y: 90,  ldir: -1, ix: ['NS 17'] },
    { c: 'CC14', n: 'Lorong Chuan',       x: 1080, y: 200, ldir: 0,  ix: [] },
    { c: 'CC13', n: 'Serangoon',          x: 960, y: 310, ldir: -1, ix: ['NE 12'] },
    { c: 'CC11', n: 'Tai Seng',           x: 850, y: 310, ldir: -1, ix: [] },
    { c: 'CC10', n: 'MacPherson',         x: 740, y: 310, ldir: -1, ix: ['DT 26'] },
    { c: 'CC8',  n: 'Dakota',             x: 630, y: 310, ldir: -1, ix: [] },
    { c: 'CC7',  n: 'Mountbatten',        x: 520, y: 310, ldir: -1, ix: [] },
    { c: 'CC5',  n: 'Nicoll Highway',     x: 410, y: 310, ldir: -1, ix: [] },
    { c: 'CC4',  n: 'Promenade',          x: 320, y: 310, ldir: -1, ix: ['DT 15'] },
    { c: 'CC34', n: 'Bayfront',           x: 240, y: 310, ldir: -1, ix: ['DT 16'] },
    { c: 'CC33', n: 'Marina Bay',         x: 180, y: 310, ldir: -1, ix: ['NS 27', 'TE 20'] },
    { c: 'CC32', n: 'Prince Edward Road', x: 120, y: 270, ldir: -1, ix: [] },
    { c: 'CC31', n: 'Cantonment',         x: 80,  y: 200, ldir: 2,  ix: [] },
    { c: 'CC30', n: 'Keppel',             x: 120, y: 130, ldir: -1, ix: [] },
    
    // Intermediate stations along top/bottom runs
    { c: 'CC28', n: 'Telok Blangah',      x: 235, y: 90,  ldir: -1, ix: [] },
    { c: 'CC26', n: 'Pasir Panjang',      x: 345, y: 90,  ldir: -1, ix: [] },
    { c: 'CC24', n: 'Kent Ridge',         x: 455, y: 90,  ldir: -1, ix: [] },
    { c: 'CC22', n: 'Buona Vista',        x: 565, y: 90,  ldir: -1, ix: ['EW 21'] },
    { c: 'CC20', n: 'Farrer Road',        x: 675, y: 90,  ldir: -1, ix: [] },
    { c: 'CC17', n: 'Caldecott',          x: 810, y: 90,  ldir: -1, ix: ['TE 9'] },
    { c: 'CC12', n: 'Bartley',            x: 895, y: 310, ldir: -1, ix: [] },
    { c: 'CC9',  n: 'Paya Lebar',         x: 685, y: 310, ldir: 1,  ix: ['EW 8'] },
    { c: 'CC6',  n: 'Stadium',            x: 465, y: 310, ldir: 1,  ix: [] },

    // Dhoby Ghaut Branch Spur (Faded/Branched inside)
    { c: 'CC1',  n: 'Dhoby Ghaut',        x: 160, y: 200, ldir: -1, ix: ['NE 6', 'NS 24'], faded: true },
    { c: 'CC2',  n: 'Bras Basah',         x: 230, y: 200, ldir: -1, ix: [], faded: true },
    { c: 'CC3',  n: 'Esplanade',          x: 300, y: 200, ldir: -1, ix: [], faded: true }
];

const LINE_COLORS = {
    CC: '#f99d25', NS: '#d42e12', EW: '#009645', NE: '#9900aa', DT: '#005da9', TE: '#9d5b25'
};

// Travel sequence around the main loop
const TRAVEL_SEQUENCE = [
    'CC29','CC28','CC27','CC26','CC25','CC24','CC23','CC22','CC21','CC20','CC19',
    'CC17','CC16','CC15','CC14','CC13','CC12','CC11','CC10','CC9','CC8','CC7',
    'CC6','CC5','CC4','CC34','CC33','CC32','CC31','CC30'
];

let curCode = 'CC29';
let dir = 'cw';

function getSeqIndex(code) { return TRAVEL_SEQUENCE.indexOf(code); }
function getStation(code) { return STATIONS.find(s => s.c === code); }

function nxtIdx(code, d) {
    let i = getSeqIndex(code);
    if (i === -1) return 0;
    if (d === 'cw') {
        return (i + 1) % TRAVEL_SEQUENCE.length;
    } else {
        return (i - 1 + TRAVEL_SEQUENCE.length) % TRAVEL_SEQUENCE.length;
    }
}

function svgEl(tag, attrs, txt) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    if (txt !== undefined) el.textContent = txt;
    return el;
}

function buildMap() {
    const svg = document.getElementById('mapSvg');
    svg.innerHTML = '';

    const trackGroup = svgEl('g');
    // Main Oval Loop Path
    const mainTrack = svgEl('path', {
        d: "M 180 90 L 960 90 A 110 110 0 0 1 1070 200 A 110 110 0 0 1 960 310 L 180 310 A 110 110 0 0 1 70 200 A 110 110 0 0 1 180 90",
        fill: "none", stroke: LINE_COLORS.CC, "stroke-width": "7", "stroke-linecap": "round", "stroke-linejoin": "round"
    });
    trackGroup.appendChild(mainTrack);

    // Dhoby Ghaut Spur Branch Path (Connecting Promenade/Bayfront to Dhoby Ghaut)
    const spurTrack = svgEl('path', {
        d: "M 160 200 L 300 200 C 340 200 320 310 320 310",
        fill: "none", stroke: "#fbe2c5", "stroke-width": "6", "stroke-linecap": "round", opacity: "0.8"
    });
    trackGroup.appendChild(spurTrack);
    svg.appendChild(trackGroup);

    drawStaticArrows(svg);

    const curSeqI = getSeqIndex(curCode);

    STATIONS.forEach(st => {
        const seqI = getSeqIndex(st.c);
        let state = 'future';
        if (st.c === curCode) {
            state = 'current';
        } else if (st.faded) {
            state = 'faded';
        } else if (seqI !== -1 && curSeqI !== -1) {
            if (dir === 'cw') {
                let dist = (seqI - curSeqI + TRAVEL_SEQUENCE.length) % TRAVEL_SEQUENCE.length;
                state = (dist <= TRAVEL_SEQUENCE.length / 2 && dist > 0) ? 'future' : 'past';
            } else {
                let dist = (curSeqI - seqI + TRAVEL_SEQUENCE.length) % TRAVEL_SEQUENCE.length;
                state = (dist <= TRAVEL_SEQUENCE.length / 2 && dist > 0) ? 'future' : 'past';
            }
        }

        let dotFill, dotStroke, dotR = 6.5, dotStrokeW = 0;
        if (state === 'current') {
            dotFill = '#ff0000'; dotStroke = '#ff0000'; dotR = 9;
        } else if (state === 'future') {
            dotFill = '#39ff14'; dotStroke = '#39ff14';
        } else if (state === 'past') {
            dotFill = '#ffce00'; dotStroke = LINE_COLORS.CC; dotStrokeW = 2.5; dotR = 7.5;
        } else {
            dotFill = '#ffffff'; dotStroke = '#fbe2c5'; dotStrokeW = 2;
        }

        svg.appendChild(svgEl('circle', {
            cx: st.x, cy: st.y, r: dotR, fill: dotFill, 
            stroke: dotStroke, 'stroke-width': dotStrokeW
        }));

        drawStationLabels(svg, st);
    });
}

function drawStationLabels(svg, st) {
    const isFaded = st.faded;
    const opacity = isFaded ? '0.35' : '1';
    
    const allCodes = [st.c, ...st.ix];
    let totalPillWidth = 0;
    const pillData = allCodes.map(code => {
        const type = code.substring(0, 2);
        const w = code.length > 4 ? 42 : 36;
        totalPillWidth += w + 4;
        return { text: code, type, w };
    });
    totalPillWidth -= 4;

    let startX = st.x - totalPillWidth / 2;
    let pillY, nameY;
    let textAnchor = "middle";
    let nameX = st.x;

    if (st.ldir === 1) {
        pillY = st.y - 22; nameY = st.y - 36;
    } else if (st.ldir === -1) {
        pillY = st.y + 11; nameY = st.y + 30;
    } else if (st.ldir === 2) {
        startX = st.x - 35 - totalPillWidth;
        pillY = st.y - 8; nameY = st.y + 14;
        nameX = startX + totalPillWidth; textAnchor = "end";
    } else if (st.ldir === 0) {
        startX = st.x + 22;
        pillY = st.y - 8; nameY = st.y + 14;
        nameX = startX; textAnchor = "start";
    }

    let curX = startX;
    pillData.forEach(p => {
        const isCC = p.type === 'CC';
        const bg = LINE_COLORS[p.type] || '#333';
        const fg = isCC ? '#000' : '#fff';

        const g = svgEl('g', { opacity });
        g.appendChild(svgEl('rect', {
            x: curX, y: pillY, width: p.w, height: 16, rx: 8, fill: bg
        }));
        
        const txt = svgEl('text', {
            x: curX + p.w / 2, y: pillY + 11.5,
            'text-anchor': 'middle', 'font-family': 'Inter, sans-serif',
            'font-size': '9.5', 'font-weight': '700', fill: fg
        });
        txt.textContent = p.text;
        g.appendChild(txt);
        svg.appendChild(g);

        curX += p.w + 4;
    });

    const nameTxt = svgEl('text', {
        x: nameX, y: nameY, 'text-anchor': textAnchor,
        'font-family': 'Inter, sans-serif', 'font-size': '10.5',
        'font-weight': '600', fill: '#111', opacity
    });
    nameTxt.textContent = st.n;
    svg.appendChild(nameTxt);
}

function drawStaticArrows(svg) {
    // Top-left direction indicator (Outer Loop CW)
    svg.appendChild(svgEl('path', {
        d: "M 25 170 L 25 75 Q 25 45 55 45 L 75 45 L 75 40 L 95 50 L 75 60 L 75 55 L 55 55 Q 35 55 35 75 L 35 170 Z",
        fill: "#39ff14", stroke: "#ffce00", "stroke-width": "1"
    }));
    // Bottom-right direction indicator
    svg.appendChild(svgEl('path', {
        d: "M 1155 130 L 1155 225 Q 1155 255 1125 255 L 1105 255 L 1105 260 L 1085 250 L 1105 240 L 1105 245 L 1125 245 Q 1145 245 1145 225 L 1145 130 Z",
        fill: "#39ff14", stroke: "#ffce00", "stroke-width": "1"
    }));
}

function updateLED() {
    const nextCode = TRAVEL_SEQUENCE[nxtIdx(curCode, dir)];
    const nxtSt = getStation(nextCode);
    document.getElementById('lcdDest').textContent = dir === 'cw' ? 'Dest: Outer Loop (via HarbourFront & Marina Bay)' : 'Dest: Inner Loop (via Marina Bay & HarbourFront)';
    document.getElementById('lcdStatus').textContent = `Next Station: ${nxtSt.n} (${nxtSt.c})`;
}

function triggerNextStation() {
    curCode = TRAVEL_SEQUENCE[nxtIdx(curCode, dir)];
    updateUI();
}

function setDir(d) {
    dir = d;
    document.getElementById('btnCW').classList.toggle('on',  d === 'cw');
    document.getElementById('btnCCW').classList.toggle('on', d === 'ccw');
    updateUI();
}

function buildStationBtns() {
    const wrap = document.getElementById('stationBtns');
    wrap.innerHTML = '';
    TRAVEL_SEQUENCE.forEach((code) => {
        const st = getStation(code);
        const b = document.createElement('button');
        b.className = 'sbtn' + (code === curCode ? ' on' : '');
        b.textContent = `${st.c} ${st.n}`;
        b.addEventListener('click', () => {
            curCode = code;
            updateUI();
        });
        wrap.appendChild(b);
    });
}

function updateStationBtns() {
    document.querySelectorAll('#stationBtns .sbtn').forEach((b, i) => {
        b.classList.toggle('on', TRAVEL_SEQUENCE[i] === curCode);
    });
}

function updateUI() {
    updateLED();
    updateStationBtns();
    buildMap();
}

buildStationBtns();
updateUI();
</script>
</body>
</html>
