<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMRT Circle Line Station Display</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .display-container {
            background: #1e1e1e;
            border: 4px solid #ff9e1b; /* CCL Orange */
            border-radius: 20px;
            padding: 30px 40px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(255, 158, 27, 0.3);
            width: 520px;
            max-width: 90%;
            position: relative;
        }

        /* Authentic Circular Map Track */
        .circle-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 15px auto;
        }
        .circle-svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg); /* Start CC1 at the top position */
        }
        .track-bg {
            fill: none;
            stroke: rgba(255, 158, 27, 0.25);
            stroke-width: 6;
        }
        .track-progress {
            fill: none;
            stroke: #ff9e1b;
            stroke-width: 6;
            stroke-linecap: round;
            stroke-dasharray: 502; /* 2 * PI * 80 */
            stroke-dashoffset: 502;
            transition: stroke-dashoffset 0.4s ease-in-out;
        }
        .station-node {
            fill: #1e1e1e;
            stroke: #ff9e1b;
            stroke-width: 2;
            r: 4;
            transition: all 0.3s ease;
        }
        .station-node.visited {
            fill: #ff9e1b;
        }
        .station-node.active {
            fill: #39ff14;
            stroke: #ffffff;
            stroke-width: 2.5;
            r: 7;
            filter: drop-shadow(0px 0px 6px #39ff14);
        }
        .circle-inner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
            font-weight: 800;
            color: #ff9e1b;
            text-align: center;
            line-height: 1.2;
            letter-spacing: 1px;
        }

        .station-code {
            font-size: 24px;
            font-weight: bold;
            color: #ff9e1b;
            margin-bottom: 5px;
        }
        .station-name {
            font-size: 34px;
            font-weight: 800;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            min-height: 42px;
        }

        /* Door Opening Indicator Banner */
        .door-banner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #121212;
            border: 2px solid #2a2a2a;
            border-radius: 10px;
            padding: 8px 20px;
            margin-bottom: 20px;
            height: 28px;
        }
        .door-side {
            font-size: 16px;
            font-weight: 800;
            color: #39ff14;
            text-shadow: 0 0 8px rgba(57, 255, 20, 0.7);
            visibility: hidden;
        }
        .door-side.active {
            visibility: visible;
            animation: blinkFast 0.8s step-end infinite;
        }
        @keyframes blinkFast {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .status-box {
            font-size: 18px;
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 8px;
            background: rgba(255, 158, 27, 0.15);
            color: #ff9e1b;
            display: inline-block;
            animation: pulseAnimation 1.5s infinite;
            margin-bottom: 25px;
        }
        @keyframes pulseAnimation {
            0% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.03); }
            100% { opacity: 0.4; transform: scale(1); }
        }

        .btn {
            background-color: #ff9e1b;
            color: #121212;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(255, 158, 27, 0.4);
        }
        .btn:hover {
            background-color: #ffa834;
            transform: translateY(-2px);
        }
        .btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="display-container">
        <!-- SVG Circular Line Map -->
        <div class="circle-container">
            <svg class="circle-svg" viewBox="0 0 200 200">
                <circle class="track-bg" cx="100" cy="100" r="80" />
                <circle class="track-progress" id="trackProgress" cx="100" cy="100" r="80" />
                <g id="stationNodesGroup"></g>
            </svg>
            <div class="circle-inner" id="lineName">CIRCLE<br>LINE</div>
        </div>
        
        <div class="station-code" id="stationCode">CC1</div>
        <div class="station-name" id="stationName">Dhoby Ghaut</div>
        
        <!-- Door Indicator Banner -->
        <div class="door-banner">
            <div class="door-side" id="doorLeft">&lt;&lt; DOORS OPENING</div>
            <div class="door-side" id="doorRight">DOORS OPENING &gt;&gt;</div>
        </div>

        <div class="status-box" id="statusText">ARRIVING AT STATION</div>
        <br>
        <button class="btn" onclick="nextStation()">Next Station</button>
    </div>

    <script>
        // Full list of operational Circle Line stations (CC1 - CC29, CC18 Bukit Brown skipped)
        const stations = [
            { code: "CC1", name: "Dhoby Ghaut", doorSide: "right" },
            { code: "CC2", name: "Bras Basah", doorSide: "left" },
            { code: "CC3", name: "Esplanade", doorSide: "right" },
            { code: "CC4", name: "Promenade", doorSide: "right" },
            { code: "CC5", name: "Nicoll Highway", doorSide: "left" },
            { code: "CC6", name: "Stadium", doorSide: "right" },
            { code: "CC7", name: "Mountbatten", doorSide: "left" },
            { code: "CC8", name: "Dakota", doorSide: "right" },
            { code: "CC9", name: "Paya Lebar", doorSide: "right" },
            { code: "CC10", name: "MacPherson", doorSide: "left" },
            { code: "CC11", name: "Tai Seng", doorSide: "right" },
            { code: "CC12", name: "Bartley", doorSide: "right" },
            { code: "CC13", name: "Serangoon", doorSide: "right" },
            { code: "CC14", name: "Lorong Chuan", doorSide: "left" },
            { code: "CC15", name: "Bishan", doorSide: "right" },
            { code: "CC16", name: "Marymount", doorSide: "right" },
            { code: "CC17", name: "Caldecott", doorSide: "left" },
            { code: "CC19", name: "Botanic Gardens", doorSide: "right" },
            { code: "CC20", name: "Farrer Road", doorSide: "left" },
            { code: "CC21", name: "Holland Village", doorSide: "right" },
            { code: "CC22", name: "Buona Vista", doorSide: "right" },
            { code: "CC23", name: "one-north", doorSide: "left" },
            { code: "CC24", name: "Kent Ridge", doorSide: "right" },
            { code: "CC25", name: "Haw Par Villa", doorSide: "left" },
            { code: "CC26", name: "Pasir Panjang", doorSide: "right" },
            { code: "CC27", name: "Labrador Park", doorSide: "right" },
            { code: "CC28", name: "Telok Blangah", doorSide: "left" },
            { code: "CC29", name: "HarbourFront", doorSide: "right" }
        ];

        let currentIndex = 0;
        const totalStations = stations.length;
        const radius = 80;
        const circumference = 2 * Math.PI * radius;

        // Build SVG Station Nodes around the Circle
        function initCircularMap() {
            const group = document.getElementById("stationNodesGroup");
            group.innerHTML = "";

            stations.forEach((station, index) => {
                const angle = (index / totalStations) * (2 * Math.PI);
                const x = 100 + radius * Math.cos(angle);
                const y = 100 + radius * Math.sin(angle);

                const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                circle.setAttribute("cx", x);
                circle.setAttribute("cy", y);
                circle.setAttribute("class", "station-node");
                circle.setAttribute("id", `node-${index}`);
                group.appendChild(circle);
            });
        }

        function updateDisplay() {
            const station = stations[currentIndex];
            
            // Update Text
            document.getElementById("stationCode").textContent = station.code;
            document.getElementById("stationName").textContent = station.name;

            // Update Circle Map Progress Line
            const trackProgress = document.getElementById("trackProgress");
            const progressRatio = currentIndex / (totalStations - 1);
            const strokeOffset = circumference - (progressRatio * circumference);
            trackProgress.style.strokeDashoffset = strokeOffset;

            // Update Station Node Highlights
            stations.forEach((_, idx) => {
                const node = document.getElementById(`node-${idx}`);
                node.classList.remove("active", "visited");
                if (idx < currentIndex) {
                    node.classList.add("visited");
                } else if (idx === currentIndex) {
                    node.classList.add("active");
                }
            });

            // Handle Door Indicator Blinking
            const doorLeft = document.getElementById("doorLeft");
            const doorRight = document.getElementById("doorRight");

            doorLeft.classList.remove("active");
            doorRight.classList.remove("active");

            // Force DOM Reflow to ensure animation loops cleanly
            void doorLeft.offsetWidth;
            void doorRight.offsetWidth;

            if (station.doorSide === "left") {
                doorLeft.classList.add("active");
            } else {
                doorRight.classList.add("active");
            }

            // Reset Pulse Animation for Status Text
            const statusBox = document.getElementById("statusText");
            statusBox.style.animation = 'none';
            statusBox.offsetHeight;
            statusBox.style.animation = 'pulseAnimation 1.5s infinite';
        }

        function nextStation() {
            currentIndex = (currentIndex + 1) % stations.length;
            updateDisplay();
        }

        // Initialize Map and Load First Station
        initCircularMap();
        updateDisplay();
    </script>

</body>
</html>
