<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TELCSG | CCL Capsule DRMD</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background: #111;
    color: #fff;
    font-family: 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px 16px;
    gap: 16px;
}

.drmd-outer {
    width: 100%;
    max-width: 1200px;
    background: #000;
    border-radius: 12px;
    border: 2px solid #333;
    padding: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
}

.drmd-panel {
    background: #ffffff;
    border-radius: 6px;
    overflow: hidden;
    width: 100%;
    display: flex;
    flex-direction: column;
}

.lcd-header {
    background: #141414;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    border-bottom: 3px solid #222;
    flex-shrink: 0;
}
.lcd-dest { font-size: 16px; font-weight: 700; color: #f99d25; }
.lcd-status { font-size: 15px; font-weight: 600; color: #fff; }

.map-container {
    width: 100%;
    background: #ffffff;
    padding: 20px 10px;
    display: flex;
    justify-content: center;
    align-items: center;
}

#mapSvg {
    width: 100%;
    max-width: 1120px;
    height: auto;
    display: block;
}

.controls {
    width: 100%;
    max-width: 1200px;
    background: #1a1a1a;
    padding: 16px;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    border: 1px solid #333;
}
.ctrl-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.ctrl-lbl { font-size: 11px; font-weight: 700; color: #888; text-transform: uppercase; min-width: 110px; }
.btn-grp { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid #333;
    background: #222;
    color: #aaa;
    cursor: pointer;
}
.btn:hover { background: #2c2c2c; color: #fff; }
.btn.on { background: #f99d25; color: #000; border-color: #f99d25; font-weight: 700; }
.btn-next { background: #39ff14; color: #000; border-color: #39ff14; font-size: 14px; font-weight: 800; padding: 10px 20px; }
.station-scroll { display: flex; gap: 6px; flex-wrap: wrap; max-height: 120px; overflow-y: auto; width: 100%; }
.sbtn {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 4px;
    border: 1px solid #333;
    background: #151515;
    color: #777;
    cursor: pointer;
}
.sbtn:hover { background: #222; color: #ccc; }
.sbtn.on { background: #f99d25; color: #000; border-color: #f99d25; font-weight: 700; }
</style>
</head>
<body>

<div class="drmd-outer">
  <div class="drmd-panel">
    <div class="lcd-header">
      <div class="lcd-dest" id="lcdDest">Circle Line</div>
      <div class="lcd-status" id="lcdStatus">Loading...</div>
    </div>
    <div class="map-container">
      <svg id="mapSvg" viewBox="0 0 1120 380" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>
</div>

<div class="controls">
  <div class="ctrl-row">
    <span class="ctrl-lbl">Action</span>
    <div class="btn-grp">
      <button class="btn btn-next" onclick="triggerNextStation()">▶ NEXT STATION</button>
    </div>
  </div>
  <div class="ctrl-row">
    <span class="ctrl-lbl">Jump To</span>
    <div class="station-scroll" id="stationBtns"></div>
  </div>
  <div class="ctrl-row">
    <span class="ctrl-lbl">Direction</span>
    <div class="btn-grp">
      <button class="btn on" id="btnCW" onclick="setDir('cw')">⟳ Outer Loop (HarbourFront)</button>
      <button class="btn" id="btnCCW" onclick="setDir('ccw')">⟲ Inner Loop (Marina Bay)</button>
    </div>
  </div>
</div>

<script>
const STATIONS = [
    { c: 'CC29', n: 'HarbourFront',       x: 160, y: 80,  ldir: 1,  ix: ['NE 1'] },
    { c: 'CC27', n: 'Labrador Park',      x: 270, y: 80,  ldir: 1,  ix: [] },
    { c: 'CC25', n: 'Haw Par Villa',      x: 380, y: 80,  ldir: 1,  ix: [] },
    { c: 'CC23', n: 'one-north',          x: 490, y: 80,  ldir: 1,  ix: [] },
    { c: 'CC21', n: 'Holland Village',    x: 600, y: 80,  ldir: 1,  ix: [] },
    { c: 'CC19', n: 'Botanic Gardens',    x: 710, y: 80,  ldir: 1,  ix: ['DT 9'] },
    { c: 'CC16', n: 'Marymount',          x: 840, y: 80,  ldir: 1,  ix: [] },
    { c: 'CC15', n: 'Bishan',             x: 930, y: 80,  ldir: -1, ix: ['NS 17'] },
    { c: 'CC14', n: 'Lorong Chuan',       x: 1040, y: 190, ldir: 0,  ix: [] },
    { c: 'CC13', n: 'Serangoon',          x: 930, y: 300, ldir: -1, ix: ['NE 12'] },
    { c: 'CC11', n: 'Tai Seng',           x: 820, y: 300, ldir: -1, ix: [] },
    { c: 'CC10', n: 'MacPherson',         x: 710, y: 300, ldir: -1, ix: ['DT 26'] },
    { c: 'CC8',  n: 'Dakota',             x: 600, y: 300, ldir: -1, ix: [] },
    { c: 'CC7',  n: 'Mountbatten',        x: 490, y: 300, ldir: -1, ix: [] },
    { c: 'CC5',  n: 'Nicoll Highway',     x: 380, y: 300, ldir: -1, ix: [] },
    { c: 'CC4',  n: 'Promenade',          x: 300, y: 300, ldir: -1, ix: ['DT 15'] },
    { c: 'CC34', n: 'Bayfront',           x: 220, y: 300, ldir: -1, ix: ['DT 16'] },
    { c: 'CC33', n: 'Marina Bay',         x: 160, y: 300, ldir: -1, ix: ['NS 27', 'TE 20'] },
    { c: 'CC32', n: 'Prince Edward Road', x: 105, y: 260, ldir: -1, ix: [] },
    { c: 'CC31', n: 'Cantonment',         x: 70,  y: 190, ldir: 2,  ix: [] },
    { c: 'CC30', n: 'Keppel',             x: 105, y: 120, ldir: -1, ix: [] },

    { c: 'CC28', n: 'Telok Blangah',      x: 215, y: 80,  ldir: -1, ix: [] },
    { c: 'CC26', n: 'Pasir Panjang',      x: 325, y: 80,  ldir: -1, ix: [] },
    { c: 'CC24', n: 'Kent Ridge',         x: 435, y: 80,  ldir: -1, ix: [] },
    { c: 'CC22', n: 'Buona Vista',        x: 545, y: 80,  ldir: -1, ix: ['EW 21'] },
    { c: 'CC20', n: 'Farrer Road',        x: 655, y: 80,  ldir: -1, ix: [] },
    { c: 'CC17', n: 'Caldecott',          x: 785, y: 80,  ldir: -1, ix: ['TE 9'] },
    { c: 'CC12', n: 'Bartley',            x: 875, y: 300, ldir: -1, ix: [] },
    { c: 'CC9',  n: 'Paya Lebar',         x: 655, y: 300, ldir: 1,  ix: ['EW 8'] },
    { c: 'CC6',  n: 'Stadium',            x: 435, y: 300, ldir: 1,  ix: [] },

    { c: 'CC1',  n: 'Dhoby Ghaut',        x: 140, y: 190, ldir: -1, ix: ['NE 6', 'NS 24'], faded: true },
    { c: 'CC2',  n: 'Bras Basah',         x: 210, y: 190, ldir: -1, ix: [], faded: true },
    { c: 'CC3',  n: 'Esplanade',          x: 280, y: 190, ldir: -1, ix: [], faded: true }
];

const LINE_COLORS = {
    CC: '#f99d25', NS: '#d42e12', EW: '#009645', NE: '#9900aa', DT: '#005da9', TE: '#9d5b25'
};

const TRAVEL_SEQUENCE = [
    'CC29','CC28','CC27','CC26','CC25','CC24','CC23','CC22','CC21','CC20','CC19',
    'CC17','CC16','CC15','CC14','CC13','CC12','CC11','CC10','CC9','CC8','CC7',
    'CC6','CC5','CC4','CC34','CC33','CC32','CC31','CC30'
];

let curCode = 'CC29';
let dir = 'cw';

function getSeqIndex(code) { return TRAVEL_SEQUENCE.indexOf(code); }
function getStation(code) { return STATIONS.find(s => s.c === code); }

function nxtIdx(code, d) {
    let i = getSeqIndex(code);
    if (i === -1) return 0;
    if (d === 'cw') {
        return (i + 1) % TRAVEL_SEQUENCE.length;
    } else {
        return (i - 1 + TRAVEL_SEQUENCE.length) % TRAVEL_SEQUENCE.length;
    }
}

function svgEl(tag, attrs, txt) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    if (txt !== undefined) el.textContent = txt;
    return el;
}

function buildMap() {
    const svg = document.getElementById('mapSvg');
    if (!svg) return;
    svg.innerHTML = '';

    const trackGroup = svgEl('g');
    const mainTrack = svgEl('path', {
        d: "M 160 80 L 930 80 A 110 110 0 0 1 1040 190 A 110 110 0 0 1 930 300 L 160 300 A 110 110 0 0 1 50 190 A 110 110 0 0 1 160 80",
        fill: "none", stroke: LINE_COLORS.CC, "stroke-width": "7", "stroke-linecap": "round", "stroke-linejoin": "round"
    });
    trackGroup.appendChild(mainTrack);

    const spurTrack = svgEl('path', {
        d: "M 140 190 L 280 190 C 320 190 300 300 300 300",
        fill: "none", stroke: "#fbe2c5", "stroke-width": "6", "stroke-linecap": "round", opacity: "0.8"
    });
    trackGroup.appendChild(spurTrack);
    svg.appendChild(trackGroup);

    const curSeqI = getSeqIndex(curCode);

    STATIONS.forEach(st => {
        const seqI = getSeqIndex(st.c);
        let state = 'future';
        if (st.c === curCode) {
            state = 'current';
        } else if (st.faded) {
            state = 'faded';
        } else if (seqI !== -1 && curSeqI !== -1) {
            let dist = (seqI - curSeqI + TRAVEL_SEQUENCE.length) % TRAVEL_SEQUENCE.length;
            if (dir === 'cw') {
                state = (dist <= TRAVEL_SEQUENCE.length / 2 && dist > 0) ? 'future' : 'past';
            } else {
                let revDist = (curSeqI - seqI + TRAVEL_SEQUENCE.length) % TRAVEL_SEQUENCE.length;
                state = (revDist <= TRAVEL_SEQUENCE.length / 2 && revDist > 0) ? 'future' : 'past';
            }
        }

        let dotFill = '#39ff14', dotStroke = '#39ff14', dotR = 6, dotStrokeW = 0;
        if (state === 'current') {
            dotFill = '#ff0000'; dotStroke = '#ff0000'; dotR = 9;
        } else if (state === 'future') {
            dotFill = '#39ff14'; dotStroke = '#39ff14';
        } else if (state === 'past') {
            dotFill = '#ffce00'; dotStroke = LINE_COLORS.CC; dotStrokeW = 2.5; dotR = 7;
        } else if (state === 'faded') {
            dotFill = '#fff'; dotStroke = '#fbe2c5'; dotStrokeW = 2;
        }

        svg.appendChild(svgEl('circle', {
            cx: st.x, cy: st.y, r: dotR, fill: dotFill, 
            stroke: dotStroke, 'stroke-width': dotStrokeW
        }));

        drawStationLabels(svg, st);
    });
}

function drawStationLabels(svg, st) {
    const isFaded = st.faded;
    const opacity = isFaded ? '0.4' : '1';
    
    const allCodes = [st.c, ...st.ix];
    let totalPillWidth = 0;
    const pillData = allCodes.map(code => {
        const type = code.substring(0, 2);
        const w = code.length > 4 ? 40 : 34;
        totalPillWidth += w + 4;
        return { text: code, type, w };
    });
    totalPillWidth -= 4;

    let startX = st.x - totalPillWidth / 2;
    let pillY, nameY;
    let textAnchor = "middle";
    let nameX = st.x;

    if (st.ldir === 1) {
        pillY = st.y - 20; nameY = st.y - 32;
    } else if (st.ldir === -1) {
        pillY = st.y + 10; nameY = st.y + 26;
    } else if (st.ldir === 2) {
        startX = st.x - 30 - totalPillWidth;
        pillY = st.y - 8; nameY = st.y + 12;
        nameX = startX + totalPillWidth; textAnchor = "end";
    } else if (st.ldir === 0) {
        startX = st.x + 20;
        pillY = st.y - 8; nameY = st.y + 12;
        nameX = startX; textAnchor = "start";
    }

    let curX = startX;
    pillData.forEach(p => {
        const isCC = p.type === 'CC';
        const bg = LINE_COLORS[p.type] || '#333';
        const fg = isCC ? '#000' : '#fff';

        const g = svgEl('g', { opacity });
        g.appendChild(svgEl('rect', {
            x: curX, y: pillY, width: p.w, height: 15, rx: 7.5, fill: bg
        }));
        
        const txt = svgEl('text', {
            x: curX + p.w / 2, y: pillY + 11,
            'text-anchor': 'middle', 'font-family': 'Inter, sans-serif',
            'font-size': '9', 'font-weight': '700', fill: fg
        });
        txt.textContent = p.text;
        g.appendChild(txt);
        svg.appendChild(g);

        curX += p.w + 4;
    });

    const nameTxt = svgEl('text', {
        x: nameX, y: nameY, 'text-anchor': textAnchor,
        'font-family': 'Inter, sans-serif', 'font-size': '10',
        'font-weight': '600', fill: '#111', opacity
    });
    nameTxt.textContent = st.n;
    svg.appendChild(nameTxt);
}

function updateLED() {
    const nextCode = TRAVEL_SEQUENCE[nxtIdx(curCode, dir)];
    const nxtSt = getStation(nextCode);
    document.getElementById('lcdDest').textContent = dir === 'cw' ? 'Dest: Outer Loop (via HarbourFront)' : 'Dest: Inner Loop (via Marina Bay)';
    document.getElementById('lcdStatus').textContent = `Next: ${nxtSt.n} (${nxtSt.c})`;
}

function triggerNextStation() {
    curCode = TRAVEL_SEQUENCE[nxtIdx(curCode, dir)];
    updateUI();
}

function setDir(d) {
    dir = d;
    document.getElementById('btnCW').classList.toggle('on',  d === 'cw');
    document.getElementById('btnCCW').classList.toggle('on', d === 'ccw');
    updateUI();
}

function buildStationBtns() {
    const wrap = document.getElementById('stationBtns');
    if (!wrap) return;
    wrap.innerHTML = '';
    TRAVEL_SEQUENCE.forEach((code) => {
        const st = getStation(code);
        const b = document.createElement('button');
        b.className = 'sbtn' + (code === curCode ? ' on' : '');
        b.textContent = `${st.c} ${st.n}`;
        b.addEventListener('click', () => {
            curCode = code;
            updateUI();
        });
        wrap.appendChild(b);
    });
}

function updateStationBtns() {
    document.querySelectorAll('#stationBtns .sbtn').forEach((b, i) => {
        b.classList.toggle('on', TRAVEL_SEQUENCE[i] === curCode);
    });
}

function updateUI() {
    updateLED();
    updateStationBtns();
    buildMap();
}

window.addEventListener('DOMContentLoaded', () => {
    buildStationBtns();
    updateUI();
});
</script>
</body>
</html>
